<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Frontend AI Engineering Capstone — a progressively built web application using HTML, CSS, and JavaScript with AI-assisted workflows." />
    <title>Frontend AI Engineering Capstone</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Main navigation">
        <span class="nav__brand">FE Capstone</span>
      </nav>
    </header>

    <main class="main">
      <section class="hero" aria-labelledby="hero-heading">
        <h1 id="hero-heading" class="hero__title">Frontend AI Engineering</h1>
        <p class="hero__subtitle">Week 1 · Environment &amp; AI Toolchain</p>
        <p class="hero__description">
          This capstone project is built week by week, using AI as a coding assistant.
          The stack is intentionally minimal: HTML, CSS, and JavaScript — no frameworks.
        </p>
        <a class="btn btn--primary" href="https://github.com/your-username/frontend-ai-capstone" target="_blank" rel="noopener noreferrer">
          View on GitHub
        </a>
      </section>

      <section class="progress" aria-labelledby="progress-heading">
        <h2 id="progress-heading" class="progress__title">Capstone Progress</h2>
        <ul class="progress__list" id="progress-list" role="list">
          <!-- Populated by script.js -->
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Roshin R G &middot; MIT License</p>
    </footer>

    <script type="module" src="script.js"></script>
  </body>
</html>
